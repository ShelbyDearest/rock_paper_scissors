<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title> Rock . Paper . Scissors </title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/love-marker" rel="stylesheet">
</head>
<body>
    <h1> Rock . Paper . Scissors </h1>
    <h3>Best out of 5 wins!</h3>
</br>
    <button id="rock">👊🏻</button>
    <button id="paper">✋🏻</button>
    <button id="scissors">✌🏻</button>
</br>
</br>
<p id="player"></p>
<p id="computer"></p> 
</br>   
<p id="roundResult"></p>
<p id="gameResult"></p>  
</br>
<div class="wrapper">
    Round: <span id="roundCountEl">0</span>
    Player: <span id="playerScoreEl">0</span>
    Computer: <span id="computerScoreEl">0</span>
</div>
</br>
</br>
<button id="reset">Reset Game</button>
<script src="script2.js" type="text/javascript"></script>
</body>
